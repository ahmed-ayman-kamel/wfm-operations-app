  Dash_Mvcc_HTML.html — NEW FILE. The MVCC Performance dashboard page (included by Index.html, next to Dash_Adherence_HTML).
  Built from Dash_Mvcc.src.html + Tailwind (compiled and scoped to #mvcd-root; see build.js). Same design system and the
  same features as the Adherence and Voyce dashboards: filters, period presets, compare, overview, workbook tables,
  drill-down drawer, data health, CSV export and Start automation.
  Server: getMvccDashboardData(), getMvccDashboardStamp() (Dash_Mvcc.gs); mvccBackfillSisense(), mvccStartPaidHours(),
  mvccSavePaidHours(), mvccReportRunFailure() (Mvcc.gs). NICE is reached only through the "WFM NICE Connector" extension.
  Tables reproduce the workbook "MVCC Performance Report" pivots sheet by sheet (Language Group, ACM, Supervisor, Agent,
  Language, Daily, Week): same 11 columns, same calculated fields, Grand Total rows, blank items hidden.
  Every figure is a ratio of sums (Productivity % = Σ Talk time ÷ Σ Paid hour, …), exactly like the pivots.
  All text that comes from data is written with textContent (never innerHTML).
-->
