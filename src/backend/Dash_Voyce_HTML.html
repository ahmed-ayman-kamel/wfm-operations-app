  function renderBody(keepPop) {
    hideTip(); if (!keepPop) closePop();
    var root = $('vd-view');
    clear(root); renderChips();
    if (!P) return;
    if (!P.dates.length && S.view !== 'health') { root.appendChild(emptyState('No data loaded yet', 'The Voyce Online Hours sheet is empty. Once the hourly load has run, this page fills in by itself.')); return; }
    if (S.view === 'health') { viewHealth(root); return; }
    var R = resolveRange();
    $('vd-sub').textContent = rangeText(R) + (hasAnyFilter() ? ', filtered' : '') + '. Hours shown as ' + (S.mode === 'sec' ? 'exact seconds.' : 'in the workbook (Voyce minutes).');
    if (R.n < 1) { root.appendChild(emptyState('No data in this period', 'Data is loaded from ' + fDayLong(dataMin()) + ' to ' + fDayLong(dataMax()) + '. Pick another period.')); return; }
    if (S.view === 'offline') { viewOffline(root, R); return; }
    var idx = select(R.cf, R.ct);
    if (!idx.length) { root.appendChild(emptyState('Nothing matches these filters', 'Remove a filter or choose a longer period.')); return; }
    if (S.view === 'overview') viewOverview(root, R, idx);
    else if (S.view === 'daily') viewDaily(root, R, idx);
    else viewGroup(root, R, idx, S.view);
  }
  function hasAnyFilter() { return DIMS.some(function (d) { return hasAny(S.filt[d.k]); }); }
  function render() { if (!P) return; closePop(); renderFilters(); renderTabs(); renderBody(); }

  function updatedText() {
    var n = $('vd-updated'), dot = $('vd-dot'), ping = $('vd-ping');
    if (!stamp || isNaN(+stamp)) { n.textContent = 'Last load unknown'; return; }
    var mins = Math.round((Date.now() - +stamp) / 60000), stale = mins > 150;
    var ig = P && P.health && P.health.ignored ? P.health.ignored.rows : 0;
    n.textContent = 'Updated ' + (mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : mins < 2880 ? Math.round(mins / 60) + ' h ago' : Math.round(mins / 1440) + ' days ago') +
      (ig ? ' · ' + fmt(ig, 'int') + ' row' + (ig === 1 ? '' : 's') + ' ignored' : '');
    dot.className = 'relative inline-flex h-2 w-2 rounded-full ' + (stale ? 'bg-warn' : 'bg-good');
    ping.className = stale ? 'hidden' : 'absolute inline-flex h-full w-full rounded-full bg-good opacity-60 animate-ping';
    $('vd-status').title = stale ? 'The hourly load has not run for over 2 hours. Check the _Load Log tab in Voyce DB.' : 'Data is reloaded every hour';
  }

  /* ================================================================ server */
  function gs(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, fail) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail); r[name].apply(r, args); });
  }
  function msg(text, kind) {
    var m = $('vd-msg'); clear(m); if (!text) return;
    m.appendChild(el('div', { class: 'animate-vd-in rounded-xl px-4 py-3 text-[13px] ring-1 ' + (kind === 'bad' ? 'bg-bad-bg text-bad ring-bad/30' : 'bg-accent/10 text-ink ring-accent/25'), role: kind === 'bad' ? 'alert' : 'status', text: text }));
  }
  function load() {
    if (loading) return Promise.resolve(); loading = true;
    if (!P) skeleton(); else $('vd-view').classList.add('opacity-60');
    return gs('getVoyceDashboardData').then(function (res) {
      msg(''); stamp = res.stamp; ignSig = String(res.ign || ''); prep(res.payload); render(); updatedText();
    }).catch(function (e) {
      var t = (e && e.message) || String(e);
      msg(/permission|access|not found|denied/i.test(t) ? 'The dashboard could not read the Voyce DB spreadsheet: ' + t + ' Ask the owner to share Voyce DB with you (Viewer is enough).' : 'The dashboard could not load: ' + t, 'bad');
      if (!P) clear($('vd-view'));
    }).then(function () { loading = false; $('vd-view').classList.remove('opacity-60'); });
  }
  function poll() {
    if (!shown || document.hidden || loading) return;
    gs('getVoyceDashboardStamp').then(function (r) { if (r && (r.stamp !== stamp || String(r.ign || '') !== ignSig)) load(); else updatedText(); }).catch(function () {});
  }
  function refreshNow() {
    var b = $('vd-refresh'); if (!P || b.disabled) return;
    b.disabled = true; b.lastChild.textContent = 'Refreshing…'; b.firstChild.classList.add('animate-spin');
    msg('Loading yesterday and today from Voyce and Sisense. This takes about a minute; you can keep using the page.');
    gs('loadVoyceOnlineHours', addDays(P.today, -1), P.today).then(function () { msg(''); loading = false; return load(); })
      .catch(function (e) { msg('Refresh failed: ' + ((e && e.message) || e), 'bad'); })
      .then(function () { b.disabled = false; b.lastChild.textContent = 'Refresh now'; b.firstChild.classList.remove('animate-spin'); });
  }

  function boot() {
    layer = $('vd-layer');
    document.addEventListener('click', function () { if (S.open) { closePop(); if (P) renderFilters(); } });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || !S.open) return;
      var id = popAnchor && popAnchor.id; closePop(); if (P) renderFilters(); var a = id && $(id); if (a) a.focus();
    });
    var lastW = window.innerWidth;
    window.addEventListener('resize', function () {
      if (window.innerWidth === lastW) return;                       // height-only changes (mobile keyboard) keep popovers open
      lastW = window.innerWidth; closePop(); clearTimeout(boot._rz); boot._rz = setTimeout(function () { if (shown && P && S.view === 'overview') renderBody(); }, 160); });
    window.addEventListener('scroll', function (e) { if (S.open && !(e.target && e.target.closest && e.target.closest('.vd-pop'))) { closePop(); if (P) renderFilters(); } }, true);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && shown) poll(); });
    $('vd-refresh').addEventListener('click', refreshNow);
    setInterval(function () { if (shown && P) updatedText(); }, 60000);
  }
  boot();

  var API = {
    show: function () { shown = true; if (!P) load(); else { poll(); if (S.view === 'overview') renderBody(); } if (!pollTimer) pollTimer = setInterval(poll, 5 * 60 * 1000); },
    hide: function () { shown = false; hideTip(); closePop(); },
    setRole: function (r) { role = r || ''; $('vd-refresh').hidden = !(role === 'Manager' || role === 'Admin'); },
    // used by the automated tests
    _t: { S: S, kpi: kpi, select: select, sumOf: sumOf, resolve: resolveRange, data: function () { return P; }, render: render, groupRows: groupRows, dailyRows: dailyRows, weekRows: weekRows, offlineGroups: offlineGroups, fmt: fmt, TABLES: TABLES }
  };
  window.VOHD_UI = API;
  (window.WFM_DASH_QUEUE = window.WFM_DASH_QUEUE || []).push({
    id: 'voyce', title: 'Voyce Performance', viewId: 'view-dash-voyce',
    icon: 'M3 12h4l3-8 4 16 3-8h4',
    onShow: API.show, onHide: API.hide, onRole: API.setRole
  });
  if (window.WFM_Dashboards) window.WFM_Dashboards.drain();
})();
</script>
