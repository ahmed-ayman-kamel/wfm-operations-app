  Built from Dash_Adherence.src.html + Tailwind (compiled and scoped to #adhd-root; see build.js). Same design system as the
  Voyce dashboard.
  Server: getAdherenceDashboardData(), getAdherenceDashboardStamp() (Dash_Adherence.gs); adhStartRun(), adhSaveReport(),
  adhReportRunFailure() (Adherence.gs). NICE is reached only through the "WFM NICE Connector" Chrome extension
  (window.postMessage bridge, see the NICE bridge section below).
  Tables reproduce the workbook "Adherence" sheet by sheet: Overall, SDACMs, Per Supervisor, Daily, Per Interpreter,
  Per Language, Per Language Group: same columns, same Queue split, same number formats, Grand Total rows.
  Every figure is a ratio of sums (Adherence % = Σ Min. in Adherence ÷ Σ Scheduled Time Min), exactly like the pivots.
