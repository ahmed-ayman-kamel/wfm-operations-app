<!--
  Dash_Acw_HTML.html — NEW FILE. The ACW Performance dashboard page (included by Index.html, next to Dash_Mvcc_HTML).
  Built from Dash_Acw.src.html + Tailwind (compiled and scoped to #acwd-root; see build.js). Same design system and the same
  features as the Adherence, Voyce and MVCC dashboards: filters, period presets, compare, overview, workbook tables, drill-down
  drawer, data health, CSV export and Start automation.
  Server: getAcwDashboardData(), getAcwDashboardStamp() (Dash_Acw.gs); acwBackfillSisense(), acwStartNice(), acwSaveNice(),
  acwReportRunFailure() (Acw.gs). NICE is reached only through the "WFM NICE Connector" extension.
  Tables reproduce the workbook "ACW_Report" level sheets (LOB, SDACMs, Supervisor, Language, Agent; the Account level is the
  Grand Total and the Overview): Assigned, Accepted, ABN, Actual ACW, Target, Achieved AVG ACW, Variance, Final Status, Overall %.
  Every figure is a ratio of sums (Achieved AVG ACW = Σ ACW minutes × 60 ÷ Σ Accepted calls), exactly like the workbook.
  Agents without accepted calls show "No calls" (the workbook showed "_" and Achieved).
  All text that comes from data is written with textContent (never innerHTML).
-->

  function hasAnyFilter() { return DIMS.some(function (d) { return hasAny(S.filt[d.k]); }); }
  function render() { if (!P) return; passCache = null; closePop(); renderFilters(); renderTabs(); renderBody(); }

  /* ================================================================ Start automation */
  var STEPS = [

    ['connector', 'Connect to NICE', 'Finding the WFM NICE Connector in this browser'],
    ['session', 'Use your NICE session', 'Opening NICE WebStation in a background tab'],

    }, function (e) {

    }).then(niceAcw).catch(function (e) {
      var t = (e && e.message) || String(e);

  }
  function niceAcw() {
    setStep('connector', 'active');
    return NICE.hello(1500).then(function (info) {
      if (!info) { setStep('connector', 'error', 'The WFM NICE Connector extension is not installed or not enabled in this browser.'); RUN.missing = true; RUN.parts.acw = { error: 'connector' }; return refreshAndFinish(); }

        var t0 = Date.now(), jobs = plan.jobs.map(function (j) { j.runId = plan.runId; return j; });

          setStep('download', 'done', fmt(rs[0].csv.length, 'int') + ' bytes from NICE');
          setStep('save', 'active', 'Replacing ' + plan.label + ' in ACW Raw Data');
          return gs('acwSaveNice', plan.runId, rs[0].csv, { reportOid: rs[0].report && rs[0].report.oid, niceSeconds: Math.round((Date.now() - t0) / 1000) }).then(function (s) {
            RUN.parts.acw = s;
            setStep('save', s.status === 'OK' ? 'done' : 'warn', fmt(s.rows, 'int') + ' rows (' + fmt(s.hours, '#,##0.0') + ' h of ACW) saved for ' + s.label + (s.warnings && s.warnings.length ? '. ' + s.warnings.join(' ') : ''));
            return refreshAndFinish();
          }, function (e) {                                         // the save itself failed: say so, never report success
            var t = (e && e.message) || String(e);
            RUN.parts.acw = { error: t, stage: 'save' };

            return refreshAndFinish();

        }, function (err) {
          var stage = err && err.stage || 'nice', text = (err && (err.message || err.error)) || 'The connector stopped.';

  function refreshAndFinish() {

  }

    var text = okS && okP ? 'Done in ' + secs + ' s: calls refreshed from Sisense and ACW ' + (p.label ? 'for ' + p.label + ' ' : '') + 'loaded from NICE.'
      : (okS ? 'Calls were refreshed from Sisense. ' : 'Sisense was not updated. ') + (okP ? 'ACW was loaded from NICE.' : p.stage === 'cancelled' ? 'ACW: stopped, nothing changed.' : p.stage === 'save' ? 'ACW was not changed (the save stopped: see the step above). Send the message to the app owner.' : 'ACW was not changed. ' + hintFor(p.stage, p.code));
    finish(okS && okP, extra ? text + ' ' + extra : text);
  }
  function hintFor(stage, code) {
    var byCode = { BUSY: 'Another NICE automation is running in this browser; wait for it to finish.', FORM_CHANGED: 'NICE seems to have changed its report form. Send this message to the app owner.', TAB_CLOSED: 'The NICE tab was closed during the run; press Start automation again and leave it open.', APPROVAL: 'Press Start automation again and choose Allow in the connector window.' };
    if (code && byCode[code]) return byCode[code];

  }

  function setStep(id, state, text) { RUN.state[id] = state; if (text !== undefined) RUN.text[id] = text; if (state === 'active' || state === 'login') RUN.cur = id; drawRun(); }
  function finish(ok, text) { RUN.active = false; RUN.done = { ok: ok, text: text }; clearInterval(RUN.timer); $('ac-run-btn').disabled = false; drawRun(); }
  function showRun() { var box = $('ac-run'); box.hidden = false; drawRun(); }

    var head = el('div', { class: 'flex flex-wrap items-center justify-between gap-3 px-5 pt-4 pb-3' },
      el('div', { class: 'min-w-0' }, el('h2', { class: 'text-[15px] font-bold text-ink', text: RUN.active ? 'Updating the ACW report…' : D && D.ok ? 'ACW report updated' : 'Automation finished with a problem' }),
        el('p', { class: 'mt-0.5 text-[12.5px] text-ink2', text: (RUN.plan ? 'ACW ' + RUN.plan.label + ' · ' : '') + (RUN.active ? secs + ' s' : '') })),
      el('div', { class: 'flex items-center gap-2' },
        RUN.active && RUN.id ? el('button', { type: 'button', class: 'ac-btn h-8', text: 'Stop NICE', on: { click: function () { NICE.cancel(RUN.id); } } }) : null,
        !RUN.active ? el('button', { type: 'button', class: 'ac-btn h-8', text: 'Close', on: { click: function () { $('ac-run').hidden = true; RUN.done = null; } } }) : null,
        !RUN.active && D && !D.ok ? el('button', { type: 'button', class: 'ac-btn-primary h-8', on: { click: startRun } }, icon(I.refresh, 13), el('span', { text: 'Try again' })) : null));
    var list = el('ol', { class: 'grid gap-px px-5 pb-4 sm:grid-cols-2 xl:grid-cols-4 xl:gap-3' });
    STEPS.forEach(function (s, k) {

        : st === 'error' ? el('span', { class: 'ac-step-dot bg-bad text-accent-ink ring-bad' }, icon(I.x, 13))

        : st === 'active' ? el('span', { class: 'ac-step-dot ring-accent text-accent' }, el('span', { class: 'h-3 w-3 rounded-full border-2 border-accent border-t-transparent animate-spin' }))
        : el('span', { class: 'ac-step-dot text-[11px] font-bold', text: String(k + 1) });
      list.appendChild(el('li', { class: 'flex gap-2.5 py-2 ' + (st === 'todo' ? 'opacity-60' : '') }, mark,
        el('div', { class: 'min-w-0' }, el('div', { class: 'text-[12.5px] font-semibold ' + (st === 'error' ? 'text-bad' : 'text-ink'), text: s[1] }), el('div', { class: 'mt-0.5 text-[11.5px] leading-snug ' + (st === 'error' ? 'text-bad' : st === 'login' ? 'text-warn font-semibold' : 'text-ink2'), text: t }))));
    });
    var bar = el('div', { class: 'h-1 overflow-hidden rounded-t-xl2 bg-canvas' }, el('div', { class: 'h-full bg-accent transition-[width] duration-700 ease-soft', style: 'width:' + (STEPS.filter(function (s) { return RUN.state[s[0]] === 'done' || RUN.state[s[0]] === 'warn'; }).length / STEPS.length * 100).toFixed(0) + '%' }));
    var c = el('section', { class: 'ac-card overflow-hidden animate-ac-in', 'aria-label': 'Start automation progress', 'aria-live': 'polite' }, bar, head, list);
    if (RUN.missing && !RUN.active) c.appendChild(el('div', { class: 'mx-5 mb-4 rounded-xl bg-canvas px-4 py-3 text-[12.5px] leading-relaxed text-ink2 ring-1 ring-rule' },
      el('b', { class: 'block text-ink', text: 'One-time setup on this computer (for the ACW time)' }),
      '1. Install "WFM NICE Connector" (ask the app owner). 2. Open NICE WebStation once and sign in as usual. 3. Reload this page and press Start automation. The first time, the connector asks you to allow this app; choose Allow.'));
    if (D && D.text) c.appendChild(el('p', { class: 'mx-5 mb-4 text-[12.5px] font-medium ' + (D.ok ? 'text-good' : 'text-ink2'), text: D.text }));
    box.appendChild(c);
  }

    hide: function () { shown = false; hideTip(); closePop(); },

    // used by the automated tests

  };
  window.ACWD_UI = API;
  (window.WFM_DASH_QUEUE = window.WFM_DASH_QUEUE || []).push({
    id: 'acw', title: 'ACW Performance', viewId: 'view-dash-acw',
    icon: 'M12 6v6l4 2M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z',

})();
